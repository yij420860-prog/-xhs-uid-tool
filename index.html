<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小红书UID提取">
<meta name="theme-color" content="#fff7f7">
<title>小红书分享者 UID 提取</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#fff3f4,#f7f7fb 55%,#fff);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#222;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 36px}
header{text-align:center;margin:18px 0 26px}
.logo{width:66px;height:66px;margin:auto;border-radius:22px;background:#ff2442;color:white;display:grid;place-items:center;font-size:30px;font-weight:800;box-shadow:0 8px 22px #ff244233}
h1{font-size:23px;margin:15px 0 7px}
.sub{color:#777;font-size:14px}
.card{background:#fff;border:1px solid #f0e9ea;border-radius:20px;padding:19px;box-shadow:0 10px 30px #27202a0a}
label{display:block;font-weight:650;margin:0 0 10px}
textarea{width:100%;min-height:128px;border:1px solid #e6e2e3;border-radius:13px;padding:13px;font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;resize:vertical;outline:none}
textarea:focus{border-color:#ff6479;box-shadow:0 0 0 3px #ff244214}
button{border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:650;cursor:pointer}
.primary{width:100%;background:#ff2442;color:white;margin-top:13px}
.secondary{background:#fff0f2;color:#d91f3a;flex:1}
.row{display:flex;gap:10px;margin-top:12px}
.result{display:none;margin-top:17px;padding:15px;background:#f8f8fa;border-radius:14px}
.result.show{display:block}
.caption{font-size:13px;color:#777;margin-bottom:8px}
.uid{font-size:17px;font-weight:700;word-break:break-all;letter-spacing:.3px}
.status{font-size:14px;line-height:1.5;color:#b42336;margin-top:12px}
.hint{font-size:13px;line-height:1.6;color:#777;margin:17px 3px 0}
footer{text-align:center;color:#999;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<main>
<header>
<div class="logo">薯</div>
<h1>小红书分享者 UID 提取</h1>
<div class="sub">免费 · 本地解码 · 不上传链接</div>
</header>
<section class="card">
<label for="input">粘贴小红书分享链接或 shareRedId</label>
<textarea id="input" placeholder="把小红书 App 里的完整分享链接粘贴到这里……"></textarea>
<button class="primary" id="go">提取分享者 UID</button>
<div class="result" id="result">
<div class="caption">分享者 UID</div>
<div class="uid" id="uid"></div>
<div class="row">
<button class="secondary" id="copy">复制 UID</button>
<button class="secondary" id="open">打开主页</button>
</div>
</div>
<div class="status" id="status" role="status"></div>
</section>
<p class="hint">说明：仅当分享链接包含 appuid 或 shareRedId 时才能提取。部分网页分享链接不包含分享者信息，因此无法解析。请仅用于正常识别分享来源，不要用于骚扰或跟踪他人。</p>
<footer>解码在当前设备浏览器中完成，不会把输入内容发送到服务器。</footer>
</main>
<script>
const KEY = "262035496752980663974569";
const $ = id => document.getElementById(id);
let currentUID = "";

function b64urlDecode(value) {
  let s = value.replace(/-/g, "+").replace(/_/g, "/");
  s += "=".repeat((4 - s.length % 4) % 4);
  const binary = atob(s);
  return Uint8Array.from(binary, ch => ch.charCodeAt(0));
}
function extract(value) {
  value = value.trim();
  if (!value) throw new Error("请先粘贴小红书分享链接。");
  let appuid = null, shareRedId = null;
  try {
    const u = new URL(value);
    appuid = u.searchParams.get("appuid");
    shareRedId = u.searchParams.get("shareRedId");
  } catch (_) {
    if (/^[A-Za-z0-9_-]+={0,2}$/.test(value)) shareRedId = value;
  }
  if (appuid && /^[0-9a-f]{24}$/i.test(appuid)) return appuid.toLowerCase();
  if (!shareRedId) throw new Error("链接里没有 appuid 或 shareRedId。请使用小红书 App 的「分享」链接，而不是普通网页链接。");
  const bytes = b64urlDecode(shareRedId);
  if (bytes.length !== 24) throw new Error("shareRedId 解码长度不是 24 字节，可能不是此算法支持的链接。");
  let out = "";
  for (let i = 0; i < 24; i++) out += String.fromCharCode(bytes[i] - Number(KEY[i]));
  out = out.toLowerCase();
  if (!/^[0-9a-f]{24}$/.test(out)) throw new Error("校验未通过：该分享参数可能不是此算法格式，未强行输出结果。");
  return out;
}
$("go").addEventListener("click", () => {
  $("status").textContent = "";
  $("result").classList.remove("show");
  try {
    currentUID = extract($("input").value);
    $("uid").textContent = currentUID;
    $("result").classList.add("show");
  } catch (e) {
    $("status").textContent = e.message;
  }
});
$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(currentUID);
    $("copy").textContent = "已复制";
    setTimeout(() => $("copy").textContent = "复制 UID", 1600);
  } catch (_) { $("status").textContent = "复制失败，请长按 UID 手动复制。"; }
});
$("open").addEventListener("click", () => {
  if (currentUID) location.href = "https://www.xiaohongshu.com/user/profile/" + currentUID;
});
</script>
</body>
</html>
